    <script>
      // Zero-FOUC immediate theme initialization
      (function() {
        try {
          const savedTheme = localStorage.getItem('blog_cms_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = savedTheme || (prefersDark ? 'dark' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();

      // If someone visits /web on static hosting, redirect to the root web app
      if (!window.location.port && window.location.pathname.includes('/web')) {
        window.location.replace('../');
      }
    </script>
