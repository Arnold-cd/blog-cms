<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg-puya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="manuscript-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0 30 L 60 30 M 30 0 L 30 60" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad-bg-puya)" />
  <rect width="1200" height="630" fill="url(#manuscript-pattern)" />

  <!-- Stylized Decorative Scroll Graphic -->
  <rect x="800" y="140" width="300" height="380" rx="16" fill="#2d2d30" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />
  <rect x="830" y="180" width="240" height="12" rx="6" fill="#f59e0b" fill-opacity="0.5" />
  <rect x="830" y="220" width="200" height="8" rx="4" fill="#71717a" />
  <rect x="830" y="244" width="220" height="8" rx="4" fill="#71717a" />
  <rect x="830" y="268" width="180" height="8" rx="4" fill="#71717a" />
  <rect x="830" y="310" width="240" height="8" rx="4" fill="#71717a" />
  <rect x="830" y="334" width="190" height="8" rx="4" fill="#71717a" />
  <rect x="830" y="358" width="210" height="8" rx="4" fill="#71717a" />
  <circle cx="950" cy="440" r="32" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
  <text x="950" y="448" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">ꯄꯨ</text>

  <!-- Badge -->
  <rect x="120" y="150" width="150" height="40" rx="20" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" />
  <text x="195" y="176" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle">CULTURE</text>

  <!-- Title (Meetei Mayek + English) -->
  <text x="120" y="260" fill="url(#gold-accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800">ꯄꯨꯌꯥꯒꯤ ꯋꯥꯈꯜꯂꯣꯟ</text>
  <text x="120" y="330" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800">Ancient Puya Manuscripts</text>

  <!-- Subtitle -->
  <text x="120" y="405" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Cosmology, herbal wisdom, and genealogical scrolls of Kangleipak</text>

  <!-- Footer Info -->
  <text x="120" y="490" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">MEETEI MAYEK (mni)  •  HISTORICAL ARCHIVE</text>
</svg>
