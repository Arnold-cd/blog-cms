<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad-bg)" />

  <!-- Abstract Geometry / Clock Circles -->
  <circle cx="950" cy="315" r="260" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" fill="none" />
  <circle cx="950" cy="315" r="180" stroke="#818cf8" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="10 14" fill="none" />
  <circle cx="950" cy="315" r="90" stroke="#c084fc" stroke-width="4" stroke-opacity="0.6" fill="none" />
  <circle cx="950" cy="315" r="12" fill="#38bdf8" filter="url(#glow)" />
  <line x1="950" y1="315" x2="1040" y2="230" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="950" y1="315" x2="910" y2="420" stroke="#c084fc" stroke-width="4" stroke-linecap="round" />

  <!-- Subtle grid lines -->
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <line x1="120" y1="0" x2="120" y2="630" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- Badge -->
  <rect x="120" y="150" width="160" height="40" rx="20" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
  <text x="200" y="176" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle">PHILOSOPHY</text>

  <!-- Title -->
  <text x="120" y="270" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800">The Architecture</text>
  <text x="120" y="340" fill="url(#grad-accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800">of Subjective Time</text>

  <!-- Subtitle -->
  <text x="120" y="415" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Why consciousness stretches seconds and compresses decades</text>

  <!-- Footer Info -->
  <text x="120" y="500" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">6 MIN READ  •  FEATURED ESSAY</text>
</svg>
