<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="orbit-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="50" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="800" height="600" fill="url(#space-bg)" />

  <!-- Geometric Grid Warp -->
  <g stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.2">
    <ellipse cx="400" cy="300" rx="340" ry="170" fill="none" />
    <ellipse cx="400" cy="300" rx="280" ry="130" fill="none" stroke-dasharray="6 8" />
    <ellipse cx="400" cy="300" rx="210" ry="90" fill="none" />
    <ellipse cx="400" cy="300" rx="140" ry="55" fill="none" />
    
    <!-- Time dial radial spokes -->
    <line x1="400" y1="300" x2="680" y2="170" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="400" y1="300" x2="120" y2="430" stroke-opacity="0.15" />
    <line x1="400" y1="300" x2="520" y2="460" stroke-opacity="0.25" />
    <line x1="400" y1="300" x2="280" y2="140" stroke-opacity="0.2" />
    <line x1="400" y1="300" x2="400" y2="80" stroke-opacity="0.4" stroke-dasharray="4 6" />
    <line x1="400" y1="300" x2="400" y2="520" stroke-opacity="0.2" />
  </g>

  <!-- Rotating Chronos Rings -->
  <circle cx="400" cy="300" r="190" stroke="url(#orbit-cyan)" stroke-width="2.5" stroke-opacity="0.6" fill="none" stroke-dasharray="14 18 4 18" />
  <circle cx="400" cy="300" r="110" stroke="#c084fc" stroke-width="3" stroke-opacity="0.7" fill="none" />
  <circle cx="400" cy="300" r="45" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.9" fill="none" stroke-dasharray="8 6" />

  <!-- Quantum / Temporal Core -->
  <circle cx="400" cy="300" r="22" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="400" cy="300" r="10" fill="#ffffff" />

  <!-- Orbital Particles -->
  <circle cx="560" cy="220" r="7" fill="#38bdf8" filter="url(#core-glow)" />
  <circle cx="270" cy="380" r="5" fill="#818cf8" />
  <circle cx="490" cy="390" r="6" fill="#c084fc" />
  <circle cx="330" cy="210" r="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="620" cy="300" r="8" fill="#c084fc" filter="url(#core-glow)" />

  <!-- Stylized Hourglass Vectors -->
  <path d="M 360 210 L 440 210 L 400 270 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.5" />
  <path d="M 360 390 L 440 390 L 400 330 Z" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-opacity="0.5" />
</svg>
