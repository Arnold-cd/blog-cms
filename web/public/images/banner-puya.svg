<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="puya-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="55%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="gold-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="gold-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep charcoal background -->
  <rect width="800" height="600" fill="url(#puya-bg)" />

  <!-- Sacred Geometry Mandala -->
  <g stroke="#fbbf24" stroke-opacity="0.15" stroke-width="1.2">
    <circle cx="400" cy="300" r="240" fill="none" />
    <circle cx="400" cy="300" r="180" fill="none" stroke-dasharray="8 8" />
    <circle cx="400" cy="300" r="120" fill="none" />
    
    <!-- Octagram Sacred Geometry -->
    <polygon points="400,100 470,230 600,300 470,370 400,500 330,370 200,300 330,230" fill="none" stroke-opacity="0.2" />
    <polygon points="400,140 450,250 560,300 450,350 400,460 350,350 240,300 350,250" fill="none" stroke-opacity="0.15" />
  </g>

  <!-- Stylized Ancient Treated Bark Scroll -->
  <rect x="250" y="160" width="300" height="280" rx="14" fill="#1c1917" stroke="url(#gold-flow)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Inscribed Manuscript Lines (Simulated Ancient Writing) -->
  <g fill="#78716c" opacity="0.7">
    <rect x="290" y="210" width="220" height="8" rx="4" fill="#fbbf24" fill-opacity="0.6" />
    <rect x="290" y="235" width="180" height="6" rx="3" />
    <rect x="290" y="255" width="200" height="6" rx="3" />
    <rect x="290" y="275" width="160" height="6" rx="3" />
    <rect x="290" y="305" width="210" height="6" rx="3" />
    <rect x="290" y="325" width="170" height="6" rx="3" />
    <rect x="290" y="345" width="190" height="6" rx="3" />
  </g>

  <!-- Sacred Royal Seal -->
  <circle cx="400" cy="390" r="28" fill="#d97706" fill-opacity="0.2" stroke="url(#gold-flow)" stroke-width="2" />
  <circle cx="400" cy="390" r="18" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 4" />
  <circle cx="400" cy="390" r="6" fill="#fef08a" filter="url(#gold-glow)" />

  <!-- Floating Sacred Sparks -->
  <circle cx="220" cy="200" r="5" fill="#fbbf24" filter="url(#gold-glow)" />
  <circle cx="580" cy="180" r="4" fill="#fef08a" />
  <circle cx="590" cy="420" r="6" fill="#f59e0b" filter="url(#gold-glow)" />
  <circle cx="210" cy="400" r="3.5" fill="#fbbf24" />
</svg>
