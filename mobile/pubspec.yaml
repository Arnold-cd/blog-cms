name: sllk
description: "SLLK - Modern Content & Article Reader powered by Git Headless CMS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  flutter_markdown: ^0.7.4+1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.0
  share_plus: ^10.1.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_pdfview: ^1.4.5
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: NotoSansMeeteiMayek
      fonts:
        - asset: assets/fonts/NotoSansMeeteiMayek-Regular.ttf
        - asset: assets/fonts/NotoSansMeeteiMayek-Bold.ttf
          weight: 700
