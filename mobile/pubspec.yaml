name: sllk
description: "SLLK - Modern Content & Article Reader powered by Git Headless CMS"
publish_to: "none"
version: 1.0.0+11

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  http: ^1.2.2
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^4.0.1
  shared_preferences: ^2.3.2
  google_fonts: ^8.2.1
  flutter_tts: ^4.2.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  intl: ^0.20.3
  shimmer: ^4.0.0
  flutter_pdfview: ^1.4.5
  path_provider: ^2.1.6
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/library.json

  fonts:
    - family: PukokEeyek
      fonts:
        - asset: assets/fonts/PukokEeyek.otf
    - family: NotoSansMeeteiMayek
      fonts:
        - asset: assets/fonts/NotoSansMeeteiMayek-Regular.ttf
        - asset: assets/fonts/NotoSansMeeteiMayek-Bold.ttf
          weight: 700
