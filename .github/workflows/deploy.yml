name: Build and Deploy Headless CMS & Web App

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'images/**'
      - 'library/**'
      - 'scripts/**'
      - 'web/**'
      - 'requirements.txt'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and committing posts.json
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Generate Index, Build Web App & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ⚙️ Build Index Manifests (posts.json & library.json)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/generate_index.py --strict
          python scripts/generate_library_index.py

      - name: 🔄 Sync CMS Assets to Web App Public Dir
        run: |
          mkdir -p web/public/images web/public/posts web/public/library
          cp posts.json web/public/
          cp library.json web/public/
          cp -r images/* web/public/images/
          cp -r posts/* web/public/posts/
          if [ -d library ]; then cp -R library/. web/public/library/; fi

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: 📦 Install Web Dependencies & Build
        run: |
          cd web
          npm install
          npm run build
          cd ..
          touch .nojekyll
          cp web/dist/index.html ./index.html
          rm -rf assets && cp -r web/dist/assets ./assets

      - name: 💾 Commit updated manifests and static bundle back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json library.json .nojekyll index.html assets/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            echo "Changes detected. Committing..."
            git commit -m "chore(cms): auto-update manifests and web build [skip ci]"
            git push origin main
          fi

      - name: 🌐 Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the compiled web application bundle (contains index.html, assets, posts.json, posts, images)
          path: 'web/dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # =========================================================================
      # 🔔 Optional Push Notification Webhook (FCM / OneSignal)
      # =========================================================================
      - name: 🔔 Send Mobile Push Notification (Optional)
        if: env.ONESIGNAL_APP_ID != '' && env.ONESIGNAL_REST_API_KEY != ''
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          echo "Fetching latest post metadata..."
          LATEST_TITLE=$(python3 -c "import json; data=json.load(open('posts.json')); print(data[0]['title'] if data else '')")
          LATEST_SUMMARY=$(python3 -c "import json; data=json.load(open('posts.json')); print(data[0]['summary'] if data else '')")
          LATEST_ID=$(python3 -c "import json; data=json.load(open('posts.json')); print(data[0]['id'] if data else '')")

          echo "Broadcasting push notification for: $LATEST_TITLE"
          curl -X POST "https://onesignal.com/api/v1/notifications" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Basic $ONESIGNAL_REST_API_KEY" \
            -d @- <<JSON_BODY
          {
            "app_id": "$ONESIGNAL_APP_ID",
            "included_segments": ["All"],
            "contents": {"en": "$LATEST_TITLE"},
            "headings": {"en": "New Article Published"},
            "subtitle": {"en": "$LATEST_SUMMARY"},
            "data": {"article_id": "$LATEST_ID"}
          }
          JSON_BODY
